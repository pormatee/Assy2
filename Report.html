<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factory Report 5W2H</title>
<style>
:root{
  --bg:#f3f8fc;--card:#ffffff;--ink:#23415d;--muted:#71879a;--line:#dbe8f1;
  --primary:#2878b5;--primary2:#2a9d8f;--soft:#edf6fb;--soft2:#eaf8f5;
  --danger:#c85c5c;--dangerbg:#fff1f1;--accent:#f0a64a
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#edf7fc 0,#f7fafc 240px);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px 14px 100px}
h1{font-size:26px;margin:2px 0 3px;letter-spacing:-.02em;color:#246b9e}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:14px;box-shadow:0 9px 28px -23px rgba(40,120,181,.5)}
label{display:block;font-size:12px;font-weight:800;color:#527086;margin:12px 0 6px}
select,input,textarea{width:100%;border:1px solid #cddfea;border-radius:13px;background:#fff;color:var(--ink);font:inherit;outline:none}
select,input{height:47px;padding:0 11px}
textarea{min-height:86px;padding:10px 11px;resize:vertical;line-height:1.45}
select:focus,input:focus,textarea:focus{border-color:#55a6d6;box-shadow:0 0 0 3px rgba(40,120,181,.10)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{border:0;border-radius:13px;padding:12px 14px;font:750 14px system-ui;cursor:pointer}
.primary{background:linear-gradient(135deg,#2878b5,#2a9d8f);color:#fff;width:100%;box-shadow:0 6px 16px -10px rgba(40,120,181,.9)}
.secondary{background:#eaf4fa;color:#286b98;border:1px solid #d5e8f3}
.danger{background:var(--dangerbg);color:var(--danger);border:1px solid #f2d4d4}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1;min-width:110px}
.hidden{display:none!important}
.context{position:sticky;top:0;z-index:50;background:rgba(243,248,252,.94);backdrop-filter:blur(12px);padding:8px 0 4px}
.contextbar{background:linear-gradient(135deg,#2878b5,#2a9d8f);color:#fff;border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 20px -15px rgba(40,120,181,.8)}
.contextbar .txt{min-width:0;flex:1}
.contextbar b,.contextbar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contextbar b{font-size:13px}.contextbar span{font-size:11px;color:#e9fbf8;margin-top:2px}
.contextbar button{background:#fff;color:#2878b5;padding:8px 10px;font-size:11px}
.formtitle{font-size:18px;font-weight:850;margin:0;color:#246b9e}
.formdesc{font-size:12px;color:var(--muted);margin-top:3px}
.fieldhead{display:flex;align-items:flex-start;gap:8px}
.badge{width:31px;height:31px;border-radius:10px;background:linear-gradient(135deg,#4c9bd0,#45b5a8);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:850;flex:0 0 auto}
.fieldtitle{font-size:14px;font-weight:850;color:#315f7e}
.hint{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.preview{background:#edf7fb;color:#294d65;border:1px solid #d6e9f2;border-radius:16px;padding:13px;white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:420px;overflow:auto}
.settings{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.settings.open{display:block}
.item{display:flex;gap:7px;align-items:center;border-bottom:1px solid var(--soft);padding:7px 0}
.item span{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.item button{padding:7px 9px;font-size:10px}
.smalltitle{font-size:13px;font-weight:850;margin:12px 0 5px;color:#2b769f}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2a8e88;color:#fff;border-radius:999px;padding:9px 13px;font-size:12px;z-index:100;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 20px -12px rgba(0,0,0,.4)}
.toast.show{opacity:1}
.quick{background:#f2faf9;border:1px dashed #9fd5cd;border-radius:14px;padding:10px;margin-top:10px;font-size:11px;color:#47716d}
#historyPanel{background:linear-gradient(180deg,#edf7fc 0,#f7fafc 240px)!important}
@media(max-width:560px){.row{grid-template-columns:1fr}.wrap{padding-top:12px}}
</style>
</head>
<body>
<div class="wrap">
<section id="home"><h1>Assy2 Report</h1><div class="sub">เลือกประเภท Report → Group → Cell แล้วกรอกแบบ 5W2H</div><div class="card">
<label>ประเภท Form</label><select id="formType"></select>

<div id="settings" class="settings"><div class="smalltitle">Form Types</div><div class="row"><input id="newForm" placeholder="ชื่อ Form ใหม่"><button id="addForm" class="secondary">+ เพิ่ม Form</button></div><div id="formList"></div><div class="smalltitle">Group / Cell</div><div class="row"><input id="newGroup" placeholder="ชื่อ Group ใหม่"><button id="addGroup" class="secondary">+ เพิ่ม Group</button></div><div class="row" style="margin-top:8px"><select id="editGroup"></select><div style="display:flex;gap:7px"><input id="newCell" placeholder="ชื่อ Cell ใหม่"><button id="addCell" class="secondary" style="white-space:nowrap">+ Cell</button></div></div><div id="groupList"></div><div class="actions"><button id="resetConfig" class="danger">คืนค่าเริ่มต้น</button></div></div>
</div></section>
<section id="report" class="hidden"><div class="context"><div class="contextbar"><div class="txt"><b id="ctxMain"></b><span id="ctxSub"></span></div><button id="backBtn">เปลี่ยน</button></div></div><div class="card"><div class="formtitle" id="reportTitle"></div><div class="formdesc" id="reportDesc"></div><div class="row"><div><label>วันที่</label><input id="date" type="date"></div><div><label>Shift</label><select id="shift"><option value="A">A</option><option value="B">B</option><option value="Day">Day</option></select></div></div></div><div id="fields"></div><div class="card"><div class="fieldtitle">Preview ข้อความ LINE</div><div class="hint">ข้อความสร้างจาก 5W2H และใช้ Group/Cell จากหน้าแรกโดยอัตโนมัติ</div><div id="preview" class="preview" style="margin-top:10px"></div><div class="actions"><button id="shareBtn" class="primary">ส่งไป LINE / แชร์</button><button id="copyBtn" class="secondary">คัดลอก</button><button id="saveBtn" class="secondary">บันทึก Draft</button><button id="saveHistoryBtn" class="secondary">📚 เก็บประวัติ</button></div></div></section>
</div>
<div id="historyPanel" class="hidden" style="position:fixed;inset:0;z-index:200;background:#f6f7f8;overflow:auto">
 <div class="wrap">
  <div class="contextbar" style="position:sticky;top:8px">
   <div class="txt"><b>ประวัติ Report</b><span>เริ่มต้นไม่มีประวัติ — บันทึกเฉพาะเมื่อกด “เก็บประวัติ”</span></div>
   <button id="historyBackBtn">← กลับ</button>
  </div>
  <div id="historyList" class="card"></div>
  <button id="clearHistoryBtn" class="danger" style="width:100%;margin-top:12px">ลบประวัติทั้งหมด</button>
 </div>
</div>

<div id="toast" class="toast"></div>
<script>

const ORDER=["what","when","where","who","why","how","howMuch"],$=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o)),esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function now(){return new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}
function loadGroups(){try{const x=JSON.parse(localStorage.getItem(CFG_KEY)||"null");if(x&&typeof x==="object"&&!Array.isArray(x)&&Object.keys(x).length)return x}catch(e){}return clone(DEFAULT_GROUPS)}function loadForms(){try{const x=JSON.parse(localStorage.getItem(FORM_KEY)||"null");if(Array.isArray(x)&&x.length)return x}catch(e){}return DEFAULT_FORMS.slice()}
let groups=loadGroups(),forms=loadForms(),ctx=null,data={};function preset(){return PRESETS[ctx?ctx.form:$("formType").value]||PRESETS.Other}function saveCfg(){localStorage.setItem(CFG_KEY,JSON.stringify(groups));localStorage.setItem(FORM_KEY,JSON.stringify(forms))}function opt(v){const o=document.createElement("option");o.value=v;o.textContent=v;return o}
function renderHome(keep=true){const f=$("formType"),g=$("group"),c=$("cell"),fv=keep?f.value:"",gv=keep?g.value:"",cv=keep?c.value:"";f.innerHTML="";forms.forEach(x=>f.appendChild(opt(x)));if(forms.includes(fv))f.value=fv;g.innerHTML="";Object.keys(groups).forEach(x=>g.appendChild(opt(x)));if(groups[gv])g.value=gv;renderCells(cv);renderHint();const eg=$("editGroup"),old=eg.value;eg.innerHTML="";Object.keys(groups).forEach(x=>eg.appendChild(opt(x)));if(groups[old])eg.value=old;renderLists()}

extContent="Delete";cr.onclick=()=>{const v=prompt("เปลี่ยนชื่อ Cell",cell);if(v&&v.trim()){groups[g][i]=v.trim();groups[g]=[...new Set(groups[g])];saveCfg();renderHome()}};cd.onclick=()=>{if(confirm("ลบ Cell "+cell+" ?")){groups[g].splice(i,1);saveCfg();renderHome()}};r.append(cr,cd);box.appendChild(r)});gl.appendChild(box)})}
function start(){ctx={form:$("formType").value,group:$("group").value,cell:$("cell").value};if(!ctx.form||!ctx.group||!ctx.cell)return alert("กรุณาเลือก Form, Group และ Cell");data={what:"",when:"",where:"",who:"",why:"",how:"",howMuch:""};$("date").value=today();$("shift").value="A";showReport()}
function showReport(){const p=preset();$("home").classList.add("hidden");$("report").classList.remove("hidden");$("ctxMain").textContent=ctx.form+" • "+ctx.group;$("ctxSub").textContent=ctx.cell;$("reportTitle").textContent=ctx.form+" — 5W2H";$("reportDesc").textContent=p.desc;const box=$("fields");box.innerHTML="";ORDER.forEach((key,i)=>{const [title,hint]=(p.labels[key]||PRESETS.Other.labels[key]);const card=document.createElement("div");card.className="card";card.innerHTML='<div class="fieldhead"><div class="badge">'+(i+1)+'</div><div><div class="fieldtitle">'+esc(title)+'</div><div class="hint">'+esc(hint)+'</div></div></div><textarea id="fld_'+key+'" placeholder="'+esc(hint)+'"></textarea>';box.appendChild(card);const ta=card.querySelector("textarea");ta.value=data[key]||"";ta.oninput=()=>{data[key]=ta.value;updatePreview();autoDraft()}});updatePreview()}

function updatePreview(){$("preview").textContent=reportText()}function draft(){return{ctx,data,date:$("date").value,timeShift:$("timeShift").value}}let timer;function autoDraft(){clearTimeout(timer);timer=setTimeout(()=>localStorage.setItem(DRAFT_KEY,JSON.stringify(draft())),350)}

function currentText(){return reportText()}

$("group").onchange=()=>renderCells();$("formType").onchange=renderHint;$("startBtn").onclick=start;$("backBtn").onclick=()=>{$("report").classList.add("hidden");$("home").classList.remove("hidden");renderHome()};$("date").oninput=()=>{updatePreview();autoDraft()};$("shift").onchange=()=>{updatePreview();autoDraft()};$("settingsBtn").onclick=()=>$("settings").classList.toggle("open");$("addForm").onclick=()=>{const v=$("newForm").value.trim();if(!v)return;if(!forms.includes(v))forms.push(v);$("newForm").value="";saveCfg();renderHome()};$("addGroup").onclick=()=>{const v=$("newGroup").value.trim();if(!v)return;if(!groups[v])groups[v]=[];$("newGroup").value="";saveCfg();renderHome()};$("addCell").onclick=()=>{const g=$("editGroup").value,v=$("newCell").value.trim();if(!g||!v)return;if(!groups[g].includes(v))groups[g].push(v);$("newCell").value="";saveCfg();renderHome()};$("resetConfig").onclick=()=>{if(confirm("คืนค่า Form / Group / Cell เป็นค่าเริ่มต้น ?")){forms=DEFAULT_FORMS.slice();groups=clone(DEFAULT_GROUPS);saveCfg();renderHome(false)}};$("clearDraftBtn").onclick=()=>{localStorage.removeItem(DRAFT_KEY);toast("ล้าง Draft แล้ว")};$("saveBtn").onclick=()=>{localStorage.setItem(DRAFT_KEY,JSON.stringify(draft()));toast("บันทึก Draft แล้ว")};$("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(currentText());toast("คัดลอกแล้ว")}catch(e){const ta=document.createElement("textarea");ta.value=currentText();document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("คัดลอกแล้ว")}};$("shareBtn").onclick=async()=>{const text=reportText();try{if(navigator.share)await navigator.share({title:"5W2H "+ctx.form,text});else{await navigator.clipboard.writeText(text);location.href="line://msg/text/"+encodeURIComponent(text)}}catch(e){}};
const HISTORY_KEY="daily_report_history_v1";
function getHistory(){
 try{const x=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}
}
function saveToHistory(){
 if(!ctx)return;
 const h=getHistory();
 h.unshift({
   id:Date.now(),
   savedAt:new Date().toISOString(),
   form:ctx.form,group:ctx.group,cell:ctx.cell,
   date:$("date").value||"",shift:$("shift").value||"",
   text:reportText()
 });
 localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,100)));
 toast("เก็บประวัติแล้ว");
}
function renderHistory(){
 const box=$("historyList"), h=getHistory();
 if(!h.length){box.innerHTML='<div style="text-align:center;padding:24px;color:#71717a">ยังไม่มีประวัติ<br><small>ระบบจะไม่เก็บอัตโนมัติ</small></div>';return}
 box.innerHTML="";
 h.forEach(item=>{
   const d=document.createElement("div");
   d.style.cssText="border-bottom:1px solid #eee;padding:12px 0";
   const when=item.savedAt?new Date(item.savedAt).toLocaleString("th-TH"):"";
   d.innerHTML='<div style="font-weight:850;font-size:13px">'+esc(item.form)+'</div>'+
     '<div style="font-size:11px;color:#71717a;margin:3px 0">'+esc(item.group)+' / '+esc(item.cell)+' • '+esc(item.date)+' • Shift '+esc(item.shift)+' • '+esc(when)+'</div>'+
     '<pre style="white-space:pre-wrap;font:11px/1.45 ui-monospace,monospace;background:#edf7fb;border:1px solid #d6e9f2;border-radius:12px;padding:9px;max-height:160px;overflow:auto">'+esc(item.text)+'</pre>';
   const del=document.createElement("button");del.className="danger";del.textContent="ลบรายการนี้";
   del.onclick=()=>{if(confirm("ลบประวัติรายการนี้ ?")){localStorage.setItem(HISTORY_KEY,JSON.stringify(getHistory().filter(x=>x.id!==item.id)));renderHistory()}};
   d.appendChild(del);box.appendChild(d);
 })
}
$("historyBtn").onclick=()=>{$("historyPanel").classList.remove("hidden");renderHistory()};
$("historyBackBtn").onclick=()=>$("historyPanel").classList.add("hidden");
$("clearHistoryBtn").onclick=()=>{if(confirm("ลบประวัติทั้งหมด ?")){localStorage.removeItem(HISTORY_KEY);renderHistory();toast("ลบประวัติทั้งหมดแล้ว")}};
$("saveHistoryBtn").onclick=saveToHistory;

renderHome();
})();
</script>
</body></html>
